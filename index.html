<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación</title>

  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      color: white;
      text-align: center;
      overflow-x: hidden;
      font-style: italic;
      background-image: url("./foto_suegra.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    * {
      font-style: italic;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* PORTADA */
    .portada {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .carta-emoji {
      background: rgba(255,255,255,0.08);
      padding: 40px 60px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.6s ease, background 0.6s ease;
      backdrop-filter: blur(10px);
    }

    .carta-emoji:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.15);
    }

    .sobre-cerrado {
      font-size: 70px;
      transition: transform 0.8s ease, opacity 0.5s ease;
    }

    .carta-emoji.abierta .sobre-cerrado {
      transform: rotate(-20deg) scale(1.3);
      opacity: 0;
    }

    .texto {
      margin-top: 10px;
      font-size: 18px;
    }

    /* INVITACIÓN */
    #invitacion {
      display: none;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .seccion {
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .contenido, .card {
      background: rgba(0,0,0,0.4);
      padding: 50px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h3 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      opacity: 1;
    }

    .contador {
      font-size: 22px;
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      line-height: 1.6;
    }

    .contador span {
      background: rgba(255,255,255,0.12);
      padding: 8px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }

    ul {
      text-align: left;
      font-size: 18px;
      margin-top: 15px;
    }

    li {
      margin: 10px 0;
    }

    .card {
      transform: translateY(100px);
      opacity: 0;
      transition: all 1s ease;
      margin-bottom: 20px;
    }

    .card.mostrar {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

<!-- PORTADA -->
<div id="portada" class="portada">
  <div class="carta-emoji" onclick="abrirInvitacion()">
    <div class="sobre-cerrado">✉️</div>
    <div class="texto">Tienes una invitación<br>haz clic para abrir</div>
  </div>
</div>

<!-- INVITACIÓN -->
<div id="invitacion">

  <section class="hero">
    <div class="contenido">
      <h1>¡SandyFest 40!</h1>
      <p>Ven a celebrar mi cumpleaños</p>
    </div>
  </section>

  <section class="seccion">
    <div class="card">
      <h3>⏳ Tiempo de vida</h3>
      <div class="contador" id="contador"></div>
    </div>
  </section>

  <section class="seccion">
    <div class="card">
      <h3>Regalos</h3>
      <ul>
        <li>El regalo es obligatorio</li>
        <li>Si no sabes que dar... El dinero siempre ayuda</li>
        <li>no llegues con las manos vacias</li>
      </ul>
    </div>
  </section>

  <section class="seccion">
    <div class="card">
      <h3>📍 Ubicación</h3>
      <p>Caoba 3196</p>
    </div>
  </section>

</div>

<script>
  function abrirInvitacion() {
    const carta = document.querySelector(".carta-emoji");
    carta.classList.add("abierta");

    setTimeout(() => {
      document.getElementById("portada").style.display = "none";
      document.getElementById("invitacion").style.display = "block";
    }, 800);
  }

  const cards = document.querySelectorAll('.card');

  window.addEventListener('scroll', () => {
    const trigger = window.innerHeight * 0.9;

    cards.forEach(card => {
      const top = card.getBoundingClientRect().top;
      if (top < trigger) {
        card.classList.add('mostrar');
      }
    });
  });

  const nacimiento = new Date("1986-03-31T00:00:00");

  function actualizarContador() {
    const ahora = new Date();

    let diferencia = ahora - nacimiento;

    const segundos = Math.floor(diferencia / 1000) % 60;
    const minutos = Math.floor(diferencia / (1000 * 60)) % 60;
    const horas = Math.floor(diferencia / (1000 * 60 * 60)) % 24;
    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

    }

    document.getElementById("contador").innerHTML = `
      <span>${edad} años</span>
      <span>${dias} días</span>
      <span>${horas} horas</span>
      <span>${minutos} minutos</span>
      <span>${segundos} segundos</span>
    `;
  }

  setInterval(actualizarContador, 1000);
  actualizarContador();
</script>

</body>
</html>
